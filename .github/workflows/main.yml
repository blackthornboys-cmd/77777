name: Build FrozenTune v4.2 VST3 & EXE Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        shell: cmd
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        shell: cmd
        run: cmake --build build --config Release

      - name: Install Inno Setup & Build EXE Installer
        shell: cmd
        run: |
          choco install innosetup -y
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\FrozenTune_Setup.iss

      - name: Upload Setup EXE & VST3
        uses: actions/upload-artifact@v4
        with:
          name: FrozenTune_v4_2_frozenmyheart
          path: |
            dist/FrozenTune_Setup_frozenmyheart.exe
            build/FrozenTune_artefacts/Release/VST3/FrozenTune.vst3
